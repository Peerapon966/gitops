apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mangalodon
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Peerapon966/gitops
        revision: HEAD
        directories:
          - path: apps/mangalodon/*
  template:
    metadata:
      name: "mangalodon-{{ .path.basename }}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/Peerapon966/gitops
          targetRevision: HEAD
          path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          enabled: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
