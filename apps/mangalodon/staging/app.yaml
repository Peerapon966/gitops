apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mangalodon-staging-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Peerapon966/gitops
    path: apps/mangalodon/staging/chart/app
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mangalodon-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
