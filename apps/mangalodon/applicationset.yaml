apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mangalodon
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Peerapon966/gitops
        revision: HEAD
        directories:
          - path: apps/mangalodon/*/*
  template:
    metadata:
      name: "mangalodon-{{ index .path.segment 2 }}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/Peerapon966/gitops
          targetRevision: HEAD
          path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
